apply plugin: 'com.android.application'

/* Yayın imzası: anahtar deponun DIŞINDA durur (../Egitim-Evi-App-imza/imza.properties).
   Dosya yoksa yayın paketi imzasız çıkar; deneme (debug) paketi her zaman derlenir. */
def imzaDosyasi = rootProject.file('../Egitim-Evi-App-imza/imza.properties')
def imza = new Properties()
if (imzaDosyasi.exists()) imzaDosyasi.withInputStream { imza.load(it) }

android {
    namespace 'org.egitimevi.aile'
    compileSdk 36

    defaultConfig {
        applicationId 'org.egitimevi.aile'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.2'
    }

    signingConfigs {
        yayin {
            if (imzaDosyasi.exists()) {
                storeFile file(imza['storeFile'])
                storePassword imza['storePassword']
                keyAlias imza['keyAlias']
                keyPassword imza['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (imzaDosyasi.exists()) signingConfig signingConfigs.yayin
        }
    }

    /* Uygulama yalnızca Türkçe: metinlerin kaynak dosyasına taşınması uyarısı kapalı. */
    lint {
        disable 'SetTextI18n'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
