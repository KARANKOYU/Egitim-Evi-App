apply plugin: 'com.android.application'

android {
    namespace 'org.egitimevi.aile'
    compileSdk 36

    defaultConfig {
        applicationId 'org.egitimevi.aile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
